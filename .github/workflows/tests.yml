name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic regression cases
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exercise documented command
        run: python scripts/assess_zero.py examples/no-activity.json --format markdown
